name: Deploy SWA

on:
  push:
    branches: [ testing ]   # or your default branch
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build step is optional for plain HTML/JS. Omit if you don't transpile.
      # - run: echo "No build step for static files"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          # IMPORTANT: app_location points to your /web folder in the repo
          app_location: /web
          # No output_location since there is no build step
          output_location: ""
          # If you have no API, leave api_location empty
          api_location: ""
