name: Validate OLHelper

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Audit all dependencies
        run: npm run security:audit:all

      - name: Build
        env:
          OLHELPER_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          OLHELPER_TENANT_ID: 00000000-0000-0000-0000-000000000000
        run: npm run build

      - name: Validate manifest
        run: npm run validate

      - name: Generate hosted manifest
        env:
          OLHELPER_HOST_ORIGIN: https://olhelper-pilot.example.com
          OLHELPER_CLIENT_ID: 10000000-0000-4000-8000-000000000000
        run: npm run manifest:hosted

      - name: Validate hosted manifest
        run: npx office-addin-manifest validate appPackage/build/hosted/manifest.json
