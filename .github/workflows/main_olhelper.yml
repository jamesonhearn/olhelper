name: Validate OLHelper

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Build
        env:
          OLHELPER_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          OLHELPER_TENANT_ID: 00000000-0000-0000-0000-000000000000
        run: npm run build

      - name: Validate manifest
        run: npm run validate

      - name: Generate hosted manifest
        run: npm run manifest:hosted -- https://olhelper-pilot.example.com

      - name: Validate hosted manifest
        run: npx office-addin-manifest validate dist/manifest.pilot.xml
