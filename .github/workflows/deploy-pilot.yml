name: Deploy OLHelper pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-main:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main deployment
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Pilot deployments must run from main."
            exit 1
          fi

  deploy:
    needs: require-main
    runs-on: ubuntu-latest
    environment: pilot

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        env:
          OLHELPER_CLIENT_ID: ${{ vars.OLHELPER_CLIENT_ID }}
          OLHELPER_TENANT_ID: ${{ vars.OLHELPER_TENANT_ID }}
        run: |
          npm run typecheck
          npm test
          npm run security:audit
          npm run security:audit:all
          npm run build

      - name: Generate hosted manifest
        env:
          OLHELPER_HOST_ORIGIN: ${{ vars.OLHELPER_HOST_ORIGIN }}
          OLHELPER_CLIENT_ID: ${{ vars.OLHELPER_CLIENT_ID }}
        run: npm run manifest:hosted

      - name: Validate hosted manifest
        run: npx office-addin-manifest validate appPackage/build/hosted/manifest.json

      - name: Record release hashes
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > olhelper-release-sha256.txt
          sha256sum appPackage/build/olhelper-pilot.zip >> olhelper-release-sha256.txt

      - name: Deploy static content
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

      - name: Publish unified app package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: olhelper-pilot-app-package
          path: |
            appPackage/build/olhelper-pilot.zip
            olhelper-release-sha256.txt
          if-no-files-found: error
