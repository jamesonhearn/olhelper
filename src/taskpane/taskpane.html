<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>OLHelper</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <h1>OLHelper</h1>
      <p class="subtitle">Persistent routing for support-case email</p>

      <section id="message-summary" aria-label="Selected message">
        <div id="subject"></div>
        <div id="tracking-id"></div>
      </section>

      <button id="track-case" type="button">
        Create routing and move message
      </button>

      <section id="confirmation" aria-label="Confirm mailbox changes" hidden>
        <p id="confirmation-message"></p>
        <p>
          OLHelper will create or reuse a case folder, create an Inbox rule,
          and move the selected message.
        </p>
        <div class="button-row">
          <button id="confirm-track-case" type="button">
            Confirm and create
          </button>
          <button id="cancel-track-case" class="secondary" type="button">
            Cancel
          </button>
        </div>
      </section>

      <div id="status" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
