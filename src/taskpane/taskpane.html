<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>OLHelper</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <h1>OLHelper</h1>
      <p class="subtitle">Persistent routing for support-case email</p>

      <section id="message-summary" aria-label="Selected message">
        <div id="subject"></div>
        <div id="tracking-id"></div>
      </section>

      <button id="track-case" type="button">
        Create routing and move message
      </button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
