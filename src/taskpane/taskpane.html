<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>OLHelper</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <h1>OLHelper</h1>
      <p class="subtitle">Persistent routing for support-case email</p>

      <section id="message-summary" aria-labelledby="message-summary-heading">
        <h2 id="message-summary-heading" class="visually-hidden">
          Selected message
        </h2>
        <div id="subject"></div>
        <div id="tracking-id"></div>
        <div id="case-state">Case status has not been checked.</div>
      </section>

      <section id="case-actions" aria-label="Case actions">
        <button id="check-status" class="secondary" type="button">
          Check case status
        </button>
        <button id="track-case" type="button">
          Track case and move message
        </button>
        <button id="archive-case" class="warning" type="button" hidden>
          Archive case
        </button>
        <button id="reopen-case" type="button" hidden>
          Reopen case
        </button>
        <button id="repair-case" class="secondary" type="button" hidden>
          Repair routing
        </button>
      </section>

      <section
        id="confirmation"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirmation-message"
        aria-describedby="confirmation-details"
        hidden
      >
        <p id="confirmation-message"></p>
        <p id="confirmation-details"></p>
        <div class="button-row">
          <button id="confirm-action" type="button">
            Confirm
          </button>
          <button id="cancel-action" class="secondary" type="button">
            Cancel
          </button>
        </div>
      </section>

      <div
        id="status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </main>
  </body>
</html>
