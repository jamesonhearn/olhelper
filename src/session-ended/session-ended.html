<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>OLHelper session ended</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <h1>Secure session ended</h1>
      <p>
        OLHelper unloaded the authenticated mailbox session. Reopen OLHelper
        when another mailbox operation is required.
      </p>
      <button id="close-pane" type="button">Close task pane</button>
      <p id="close-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
  </body>
</html>
